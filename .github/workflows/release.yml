name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish, normally derived from the GitHub release tag
        type: string
        required: true
      publish:
        description: Publish to npm via GitHub OIDC trusted publishing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  SLEDGE_RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_version }}

jobs:
  verify:
    name: Verify release artifact
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.release-version.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate release version
        id: release-version
        env:
          RELEASE_VERSION: ${{ env.SLEDGE_RELEASE_VERSION }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const input = process.env.RELEASE_VERSION || '';
          const version = input.startsWith('v') ? input.slice(1) : input;
          const numericIdentifier = String.raw`(?:0|[1-9]\d*)`;
          const nonNumericIdentifier = String.raw`\d*[A-Za-z-][0-9A-Za-z-]*`;
          const prereleaseIdentifier = `(?:${numericIdentifier}|${nonNumericIdentifier})`;
          const semver = new RegExp(
            `${numericIdentifier}\\.${numericIdentifier}\\.${numericIdentifier}` +
              `(?:-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*)?`,
          );

          if (semver.exec(version)?.[0] !== version) {
            throw new Error(`Invalid release version: ${input}`);
          }

          const output = process.env.GITHUB_OUTPUT;
          if (!output) {
            throw new Error('Missing GITHUB_OUTPUT from workflow context');
          }

          fs.appendFileSync(output, `package-version=${version}\n`);
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate package version
        env:
          SLEDGE_PACKAGE_VERSION: ${{ steps.release-version.outputs.package-version }}
        run: npm version --no-git-tag-version -- "$SLEDGE_PACKAGE_VERSION"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate package version
        env:
          SLEDGE_PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
        run: npm version --no-git-tag-version -- "$SLEDGE_PACKAGE_VERSION"

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --provenance --access public
